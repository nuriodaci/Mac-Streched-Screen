name: Swift checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Hardware-independent checks
        run: ./Scripts/check.sh
      - name: Assemble signed local preview
        run: ./Scripts/build-app.sh release
      - name: Verify nested signatures
        run: codesign --verify --deep --strict --verbose=2 dist/Mac-Streched-Screen.app
